<style>
  .wrapper{width:min(960px,92vw)}
  header,section,footer{float:none;position:static;width:auto}
  header{padding-bottom:10px;border-bottom:1px solid #e5e5e5;margin-bottom:20px}
  footer{margin-top:30px}
  pre{overflow-x:auto}
  .mermaid{text-align:center;margin:1em 0}
</style>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  document.querySelectorAll('pre > code.language-mermaid').forEach(code => {
    const d = document.createElement('div');
    d.className = 'mermaid';
    d.textContent = code.textContent;
    code.parentElement.replaceWith(d);
  });
  mermaid.initialize({ startOnLoad: false });
  await mermaid.run();
</script>
